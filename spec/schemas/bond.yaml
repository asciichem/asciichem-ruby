%YAML 1.2
---
$id: "https://github.com/asciichem/asciichem-model/v1/bond"
title: AsciiChem Bond node
description: |
  A bond between adjacent atoms in a linear structure. Kind enum is
  the single source of truth shared by every implementation; adding a
  kind is a MINOR model bump.
type: object
required: [type]
properties:
  type:
    const: bond
  kind:
    default: single
    enum: [single, double, triple, quadruple, wedge, hash, dative, wavy, aromatic]
    description: |
      single (-), double (=), triple (#), quadruple (##), wedge (>-),
      hash (-<), dative (~>), wavy (~~), aromatic (SMILES/molfile
      aromatic bonds).
  direction:
    enum: [up, down]
    description: |
      SMILES directional single bond (`/` up, `\` down) flanking a
      stereogenic double bond — E/Z stereo. Only meaningful when kind
      is single. Absent means the bond carries no stated direction.
additionalProperties: false
