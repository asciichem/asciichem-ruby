---
"$id": https://github.com/asciichem/asciichem-model/v1/molecule
title: AsciiChem Molecule node
description: |
  An ordered sequence of atoms/groups with optional coefficient and
  attached substance identifiers (CML-level annotations).
type: object
required:
- type
- nodes
properties:
  type:
    const: molecule
  nodes:
    type: array
    description: Ordered child nodes (atoms, bonds, groups, nested molecules).
    items:
      if:
        properties:
          type:
            const: molecule
        required:
        - type
      then:
        "$ref": molecule.yaml
      else:
        if:
          properties:
            type:
              const: group
          required:
          - type
        then:
          "$ref": group.yaml
        else:
          if:
            properties:
              type:
                const: bond
            required:
            - type
          then:
            "$ref": bond.yaml
          else:
            "$ref": atom.yaml
    minItems: 1
  coefficient:
    type: string
    pattern: "^\\d+$"
    description: Stoichiometric coefficient ("2" in 2H_2O).
  stereo:
    type: string
    enum:
    - R
    - S
    - E
    - Z
    - alpha
    - beta
    description: Stereochemistry marker ((R)-, (S)-, (E)-, (Z)-, (alpha)-, (beta)-).
  state:
    type: string
    enum:
    - precipitate
    - gas
    description: The molecule-level state mark (grammar v0.7.0) —
      precipitate (`AgCl v`, typeset as the down arrow) or gas
      (`AgCl ^`, the up arrow). Additive per the v1 additive rule.
  phase:
    type: string
    enum:
    - aqueous
    - liquid
    - solid
    - gas
    description: The molecule-level phase (grammar v0.11.0) — the tight
      parenthesised mhchem spelling — aqueous (`NaCl(aq)`), liquid
      (`H_2O(l)`), solid (`Fe(s)`), gas (`CO_2(g)`). Collision-free by
      case against the group reading. Additive per the v1 additive rule.
  identifiers:
    type: array
    description: Substance identifiers attached to this molecule.
    items:
      "$ref": identifier.yaml
additionalProperties: false
