name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match lib/asciichem/version.rb)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): the publisher registered on RubyGems.org
    # is repository asciichem/asciichem-ruby + workflow release.yml, with
    # no environment — so this job must not claim one.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify version matches input
        run: |
          actual=$(ruby -e 'require "./lib/asciichem/version"; print AsciiChem::VERSION')
          if [ "$actual" != "${{ inputs.version }}" ]; then
            echo "Version mismatch: input=${{ inputs.version }}, lib/asciichem/version.rb=$actual"
            exit 1
          fi
          echo "Releasing $actual"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Builds and pushes using the GitHub OIDC identity — no API keys.
      - uses: rubygems/release-gem@v1
      - name: Summary
        run: |
          echo "Released asciichem ${{ inputs.version }} to RubyGems"
          echo "https://rubygems.org/gems/asciichem"
