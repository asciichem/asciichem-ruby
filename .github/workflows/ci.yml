name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Hermetic CI: the corpus ref is pinned, never floating. Bump this
  # one line deliberately with each corpus release (the tag carries
  # what changed).
  CORPUS_REF: v0.8.0

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Clone conformance corpus (asciichem-tests)
        uses: actions/checkout@v7
        with:
          repository: asciichem/asciichem-tests
          ref: ${{ env.CORPUS_REF }}
          path: .asciichem-tests
      - name: Point the suite at the corpus and record its version
        run: |
          echo "ASCIICHEM_CORPUS=$(pwd)/.asciichem-tests/corpus/fixtures" >> "$GITHUB_ENV"
          echo "ASCIICHEM_CORPUS_VERSION=${{ env.CORPUS_REF }}" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      - name: Publish conformance report
        if: matrix.ruby == '3.4'
        uses: actions/upload-artifact@v4
        with:
          name: conformance
          path: conformance.json
          if-no-files-found: warn
