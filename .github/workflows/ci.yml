name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Clone conformance corpus (asciichem-tests)
        uses: actions/checkout@v7
        with:
          repository: asciichem/asciichem-tests
          path: .asciichem-tests
      - name: Point the suite at the corpus and record its version
        run: |
          echo "ASCIICHEM_CORPUS=$(pwd)/.asciichem-tests/corpus/fixtures" >> "$GITHUB_ENV"
          git -C .asciichem-tests fetch --depth 1 --tags --quiet
          echo "ASCIICHEM_CORPUS_VERSION=$(git -C .asciichem-tests describe --tags --abbrev=0 2>/dev/null || echo main)" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      - name: Publish conformance report
        if: matrix.ruby == '3.4'
        uses: actions/upload-artifact@v4
        with:
          name: conformance
          path: conformance.json
          if-no-files-found: warn
